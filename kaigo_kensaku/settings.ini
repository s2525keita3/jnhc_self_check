;----------------------------------------------------------------------
; 介護事業所情報取得ツール 設定ファイル
;
; ■ 通常は「ツールを実行.bat」をダブルクリックし、画面で選んでください。
;   このファイルを直接編集する必要はありません。
;
; ■ ここの cities / services は、画面を開いたときの初期選択として使われます。
;   また「設定ファイルで実行.bat」はこの内容のまま自動で取得します。
;----------------------------------------------------------------------

[dev]
; True : ログを詳しく残す（うまくいかないときの調査用）
; False: エラーのみ記録する（通常使用時）
debug = True

; True : ブラウザを表示する（動きを見たいとき）
; False: 表示しない（速い。通常はこちら）
display = False

; True : 取得したページのHTMLを logs\html\ に保存する（調査用。大量に出ます）
dump_html = False

[search]
; 都道府県名
pref = 兵庫県

; 市区町村（カンマ区切りで複数指定できます）
;   例1) 西宮市                          … 1つだけ
;   例2) 西宮市, 尼崎市, 芦屋市           … 複数まとめて
;   例3) 神戸市*                         … 神戸市の全9区をまとめて（末尾の * が「全部」の意味）
;   例4) 神戸市*, 西宮市, 尼崎市, 芦屋市  … 組み合わせもできます
;   例5) ALL                             … 兵庫県内の全市町
cities = 西宮市

; 市区町村名の照合方法  partial : 部分一致 / exact : 完全一致
search_type = partial

; 取得するサービス種別（カンマ区切りで複数指定できます）
;   例) 居宅介護支援, 訪問看護
services = 居宅介護支援

[output]
; 出力先Excelファイル（{pref}=都道府県, {date}=実行日 YYYYMMDD に置き換わります）
file = 介護事業所一覧_{pref}_{date}.xlsx
; True : サービスごとの「全件」統合シートを作る
summary_sheet = True
; True : 市区町村ごとのシートも作る
per_city_sheet = True
; True : オートフィルタ・ウィンドウ枠固定・罫線を付ける
decorate = True
; True : 営業時間の「時分～時分」や日付の桁を整形する
normalize = True

[run]
; ページ遷移ごとの待機秒数（サイトへの負荷軽減。短くしすぎないでください）
wait = 1.0
; 通信失敗時のリトライ回数
retry = 3
; True : 前回の続きから再開する
resume = True

; お試し実行: 1つの市区町村につき、ここに書いた件数だけ取得して終わる。
;   0  … すべて取得する（通常はこちら）
;   5  … 先頭5件だけ取得して、ちゃんと取れているか確かめる
; お試しのときは出力ファイル名に「_お試し」が付き、
; 進捗（続きから取得）にも記録されません。本番データと混ざらないようにするためです。
limit = 0

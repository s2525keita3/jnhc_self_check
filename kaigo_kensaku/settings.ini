;----------------------------------------------------------------------
; 介護事業所情報取得ツール 設定ファイル
; 変更した場合はツールを再起動してください
;----------------------------------------------------------------------

[dev]
; True : ログレベル DEBUG（解析時）  False : ログレベル ERROR（通常使用時）
debug = True
; True : ブラウザを表示する  False : 表示しない（高速）
display = False
; True : 取得した各ページのHTMLを logs/html/ に保存する（サイト構成変更時の調査用）
dump_html = False

[search]
; 都道府県名（例: 兵庫県）。空欄なら起動時に対話で聞きます
pref = 兵庫県

; 市区町村（複数可・カンマ区切り）
;   例) 西宮市, 尼崎市, 芦屋市
;   前方一致ワイルドカード  … 神戸市*      → 神戸市の全区をまとめて取得
;   都道府県内すべて        … ALL
;   ファイル指定            … @cities.txt （1行1自治体）
cities = 神戸市*, 西宮市, 尼崎市, 芦屋市

; 市区町村名の照合方法  partial : 部分一致 / exact : 完全一致
search_type = partial

; 取得するサービス種別（複数可・カンマ区切り）… config/services.csv の「サービス名」
services = 居宅介護支援, 訪問看護

[output]
; 出力先Excelファイル（{date} は実行日 YYYYMMDD に置換）
file = 介護事業所一覧_{date}.xlsx
; True : サービスごとの「全件」統合シートを作る
summary_sheet = True
; True : 市区町村ごとのシートも作る
per_city_sheet = True
; True : オートフィルタ・ウィンドウ枠固定・罫線を付ける
decorate = True
; True : 営業時間の「時分～時分」や全角スペースなどを整形する
normalize = True

[run]
; ページ遷移ごとの待機秒数（サイトへの負荷軽減。0.5〜2.0 程度を推奨）
wait = 1.0
; 通信失敗時のリトライ回数
retry = 3
; True : 前回の続きから再開する（logs/progress.json を使用）
resume = True
